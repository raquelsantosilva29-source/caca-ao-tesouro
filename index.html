
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Você é meu pequeno planeta ✦</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #111c36;
  --gold: #f0c98e;
  --cream: #f9ebd4;
  --rose: #e7a6aa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(
    ellipse at 50% 25%,
    #354666,
    #111c36 70%
  );
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 10% 20%, white 90%, transparent),
    radial-gradient(2px 2px at 75% 30%, #ffe2a5 90%, transparent),
    radial-gradient(1px 1px at 40% 70%, white 90%, transparent);
  background-size: 240px 210px;
  opacity: .45;
  animation: twinkle 5s infinite alternate;
}

@keyframes twinkle {
  to { opacity: .16; }
}

header, footer {
  max-width: 1120px;
  margin: auto;
  padding: 22px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

header {
  border-bottom: 1px solid #ffffff22;
}

.brand {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
}

.gold {
  color: var(--gold);
}

button {
  cursor: pointer;
  font: inherit;
}

button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.sound, .secondary {
  border: 1px solid #ffffff66;
  background: #ffffff10;
  color: var(--cream);
  border-radius: 30px;
  padding: 10px 16px;
}

.stage {
  max-width: 1120px;
  min-height: 75vh;
  margin: auto;
  padding: 45px 6%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 35px;
  align-items: center;
  animation: enter .5s ease;
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

h1, h2 {
  font: 400 clamp(43px, 5.5vw, 75px)/1.12
    'Playfair Display', serif;
  margin: 15px 0 25px;
}

em {
  color: var(--gold);
}

p {
  line-height: 1.85;
  color: #ddd8d4;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
}

.primary {
  background: var(--gold);
  color: #15203a;
  border: 0;
  border-radius: 30px;
  padding: 15px 24px;
  font-weight: 700;
  transition: .2s;
}

.primary:hover,
.secondary:hover {
  transform: translateY(-3px);
  filter: brightness(1.1);
}

.panel {
  border: 1px solid #ffffff35;
  border-radius: 16px;
  background: #ffffff0b;
  padding: 20px;
  margin-top: 25px;
  backdrop-filter: blur(7px);
}

.panel h3 {
  font: 400 24px 'Playfair Display', serif;
  color: var(--gold);
}

.visual {
  position: relative;
  min-height: 370px;
  display: grid;
  place-items: center;
}

.visual svg {
  width: 100%;
  max-width: 490px;
  filter: drop-shadow(0 18px 30px #0005);
}

.float {
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-13px); }
}

.choice {
  display: inline-block;
  background: #ffffff12;
  color: white;
  border: 1px solid #ffffff55;
  border-radius: 10px;
  padding: 12px;
  margin: 5px;
}

.choice:hover {
  background: #e8bb80;
  color: #16203b;
}

.status {
  color: var(--gold);
  min-height: 30px;
  font-size: 14px;
}

.star {
  position: absolute;
  border: 0;
  background: transparent;
  color: #ffe6a6;
  font-size: 40px;
  filter: drop-shadow(0 0 10px #ffe0a0);
  animation: pulse 2s infinite alternate;
}

.star:hover {
  transform: scale(1.3);
}

.star.found {
  color: #a6f2ce;
}

@keyframes pulse {
  to { opacity: .5; }
}

.memory {
  position: absolute;
  bottom: 0;
  left: 5%;
  right: 5%;
  background: #f8ebd8;
  color: #303b50;
  padding: 17px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 12px 35px #0005;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  max-width: 330px;
  margin: auto;
}

.tile {
  aspect-ratio: 1;
  background: #e4b5ac;
  border: 2px solid #fff5;
  border-radius: 10px;
  font-size: 35px;
  transition: .2s;
}

.tile:hover {
  transform: scale(1.05);
}

.tile.open {
  background: #f3dfb8;
}

.tile.matched {
  background: #a6bdb2;
}

.paths {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.node {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #ffffff15;
  border: 1px solid #e9c38b;
  color: #f4d7a7;
  font-size: 29px;
  transition: .25s;
}

.node.active {
  background: #e9c38b;
  color: #18223c;
  transform: scale(1.1);
}

input {
  background: #ffffff14;
  color: white;
  border: 1px solid #ffffff77;
  border-radius: 9px;
  padding: 15px;
  font-size: 19px;
  width: 160px;
  letter-spacing: 4px;
}

footer {
  font-size: 11px;
  color: #aaa;
  letter-spacing: 1px;
}

#progress {
  display: flex;
  gap: 5px;
}

#progress i {
  width: 20px;
  height: 4px;
  background: #ffffff44;
  border-radius: 8px;
}

#progress i.on {
  background: var(--gold);
}

.confetti {
  position: fixed;
  top: -30px;
  pointer-events: none;
  z-index: 99;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(520deg);
    opacity: 0;
  }
}

@media (max-width: 760px) {
  .stage {
    grid-template-columns: 1fr;
    padding-top: 25px;
    gap: 8px;
  }

  .visual {
    min-height: 290px;
    order: -1;
  }

  .visual svg {
    max-height: 330px;
  }

  h1, h2 {
    font-size: 44px;
  }

  header {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    ✦ meu <span class="gold">pequeno universo</span>
  </div>

  <div id="progress"></div>

  <button class="sound" id="musicButton">
    ♫ tocar música
  </button>
</header>

<audio
  id="music"
  src="musica.mp3"
  loop
  preload="none">
</audio>

<main id="app"></main>

<footer>
  <span>UM LIVRO-JOGO FEITO PARA VOCÊ</span>
  <span>✧ com amor</span>
</footer>

<script>

/* ==========================================
   PERSONALIZE AS INFORMAÇÕES AQUI
========================================== */

const CONFIG = {
  nome: "meu amor",
  senha: "0709",

  memorias: [
    "O universo ficou diferente depois de você.",

    "Há dias que eu gostaria de guardar num potinho.",

    "Algumas coincidências são bonitas demais para serem só acaso."
  ]
};

/* ==========================================
   VARIÁVEIS DO JOGO
========================================== */

let chapter = 0;
let stars = new Set();
let petals = 0;
let seq = [];
let cards = [];
let flipped = [];
let matches = 0;
let locked = false;

const app = document.getElementById('app');
const music = document.getElementById('music');
const musicButton = document.getElementById('musicButton');

music.volume = 0.45;

/* ==========================================
   PLAYER DE MÚSICA
========================================== */

musicButton.onclick = async () => {
  if (music.paused) {
    try {
      await music.play();
      musicButton.textContent = "♫ pausar música";
    } catch (e) {
      musicButton.textContent = "Adicione musica.mp3";
    }
  } else {
    music.pause();
    musicButton.textContent = "♫ tocar música";
  }
};

/* ==========================================
   EFEITOS SONOROS
========================================== */

function sound(f = 650) {
  try {
    let a = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    let o = a.createOscillator();
    let g = a.createGain();

    o.frequency.value = f;

    g.gain.setValueAtTime(.06, a.currentTime);
    g.gain.exponentialRampToValueAtTime(
      .001, a.currentTime + .16
    );

    o.connect(g);
    g.connect(a.destination);

    o.start();
    o.stop(a.currentTime + .17);

    setTimeout(() => a.close(), 400);
  } catch (e) {}
}

/* ==========================================
   CONFETES E ESTRELAS
========================================== */

function celebrate() {
  for (let i = 0; i < 22; i++) {
    let x = document.createElement('span');

    x.className = 'confetti';
    x.textContent = ['✦', '♡', '✧', '✿'][i % 4];
    x.style.left = Math.random() * 100 + 'vw';

    x.style.color = [
      '#f5d29a',
      '#e6a6aa',
      '#c7d8cb'
    ][i % 3];

    x.style.fontSize =
      (15 + Math.random() * 19) + 'px';

    x.style.animationDelay =
      Math.random() * .5 + 's';

    document.body.append(x);

    setTimeout(() => x.remove(), 3600);
  }
}

/* ==========================================
   DESENHOS EM SVG
   PEQUENO PRÍNCIPE, ROSA E RAPOSA
========================================== */

function art(type = 'planet') {

  const prince = `
  <g transform="translate(280 112)">
    <path d="M-23 48 L-32 107 L-8 107 L0 65 L12 107 L34 107 L21 48"
      fill="#ead3a3"/>

    <path d="M-29 11 L-39 61 L30 61 L39 11Z"
      fill="#78a3a0"/>

    <path d="M-31 22 L-66 50 M31 22 L65 47"
      stroke="#edcfad"
      stroke-width="10"
      stroke-linecap="round"/>

    <circle cy="-18" r="27" fill="#f2d3b1"/>

    <path d="M-28 -29 Q-28 -68 -2 -51 Q24 -70 30 -27
             L10 -40 L-4 -29 L-13 -42Z"
      fill="#dfbf6b"/>

    <path d="M-8 -16 h3 m15 0 h3"
      stroke="#555"
      stroke-width="3"
      stroke-linecap="round"/>

    <path d="M-3 -5 Q3 0 9 -5"
      stroke="#8b6560"
      fill="none"
      stroke-width="2"/>

    <path d="M-39 15 Q-85 45 -76 85 Q-49 72 -35 48"
      fill="#c9a9a0"/>
  </g>`;

  const rose = `
  <g transform="translate(370 167)">
    <path d="M0 78 Q-8 25 0 -20"
      stroke="#6a9074"
      stroke-width="5"
      fill="none"/>

    <path d="M-2 47 Q-27 19 -36 36 Q-22 58 -2 53"
      fill="#7da387"/>

    <path d="M-19 -14 Q-42 -48 -12 -54
             Q0 -73 16 -52
             Q45 -43 18 -11Z"
      fill="#d67e87"/>

    <path d="M-7 -25 Q-16 -49 4 -47
             Q22 -42 7 -25Z"
      fill="#f1b1aa"/>
  </g>`;

  const fox = `
  <g transform="translate(295 190)">
    <path d="M-60 75 Q-170 65 -140 -2
             Q-105 -35 -70 35"
      fill="#d48c60"/>

    <path d="M-135 0 Q-118 -24 -101 0"
      fill="#fff1d9"/>

    <path d="M-65 -15 L-47 -86 L-7 -49
             L25 -85 L46 -10
             Q62 70 -7 95
             Q-73 75 -65 -15Z"
      fill="#d99a6d"/>

    <path d="M-60 21 Q-37 44 -6 32
             Q19 47 42 18
             Q27 84 -6 90
             Q-46 86 -60 21Z"
      fill="#f8e8d3"/>

    <path d="M-38 7 l8 0 m35 0 l8 0"
      stroke="#3b4051"
      stroke-width="4"
      stroke-linecap="round"/>

    <path d="M-13 28 l14 0 l-7 8Z"
      fill="#414352"/>
  </g>`;

  return `
  <svg viewBox="0 0 560 460"
    role="img"
    aria-label="${
      type === 'fox'
        ? 'Uma raposa ilustrada'
        : type === 'prince'
        ? 'Um pequeno viajante de cabelos dourados sobre seu planeta'
        : 'Um pequeno planeta com uma rosa'
    }">

    <g class="float">
      <circle cx="280" cy="285" r="147"
        fill="#c5c0ab"/>

      <circle cx="280" cy="285" r="135"
        fill="#d7c8a9"/>

      <path d="M151 293 Q220 245 281 294
               T414 274
               Q391 400 282 422
               Q179 415 151 293Z"
        fill="#9fb0a5"/>

      <path d="M165 226 Q245 178 374 226"
        stroke="#f5e6c8"
        stroke-width="9"
        fill="none"
        opacity=".6"/>

      ${type === 'fox' ? fox : rose}
      ${type === 'prince' ? prince : ''}
    </g>

    <g fill="#f3d79b">
      <path d="M75 80 l5 15 15 5
               -15 5 -5 15 -5 -15
               -15 -5 15 -5Z"/>

      <path d="M468 114 l4 12 12 4
               -12 4 -4 12 -4 -12
               -12 -4 12 -4Z"/>

      <circle cx="480" cy="350" r="3"/>
      <circle cx="105" cy="345" r="3"/>
    </g>
  </svg>`;
}

/* ==========================================
   CONSTRUÇÃO DAS PÁGINAS
========================================== */

function view(
  label,
  title,
  description,
  game,
  visual = 'planet'
) {
  app.innerHTML = `
    <section class="stage">
      <div>
        <div class="eyebrow">${label}</div>
        <h2>${title}</h2>
        <p>${description}</p>
        ${game}
      </div>

      <div class="visual">
        ${art(visual)}
        <div id="overlay"></div>
      </div>
    </section>
  `;

  document.getElementById('progress').innerHTML =
    Array.from({length: 5}, (_, i) =>
      `<i class="${i < chapter ? 'on' : ''}"></i>`
    ).join('');
}

function go(n) {
  chapter = n;
  window.scrollTo(0, 0);
  render();
}

function win() {
  celebrate();
  sound(850);
  document.getElementById('next').hidden = false;
}

/* ==========================================
   HISTÓRIA E CAPÍTULOS
========================================== */

function render() {

  /* PRÓLOGO */

  if (chapter === 0) {
    view(
      'PRÓLOGO · UMA VIAGEM PARA VOCÊ',

      'Você é meu <em>pequeno planeta.</em>',

      'Há muitos mundos no céu. Mas existe um que faz todo o resto parecer diferente. Vamos descobrir o que guardam as estrelas?',

      `<button class="primary" onclick="go(1)">
        Começar a viagem ✦
      </button>`,

      'prince'
    );
  }

  /* CAPÍTULO 1 - ESTRELAS */

  if (chapter === 1) {
    view(
      'CAPÍTULO I · ESTRELAS',

      'O céu das <em>lembranças.</em>',

      'Encontre as três estrelas escondidas ao redor do planeta. Cada uma guarda uma lembrança.',

      `<div class="panel">
        <h3>Seu céu particular</h3>

        <p id="status">
          ${stars.size}/3 lembranças encontradas
        </p>

        <button id="next"
          class="primary"
          onclick="go(2)"
          ${stars.size < 3 ? 'hidden' : ''}>
          Próximo capítulo →
        </button>
      </div>`
    );

    const v = document.querySelector('.visual');

    [[10, 15], [80, 20], [20, 72]].forEach(
      ([x, y], i) => {

        let b = document.createElement('button');

        b.className =
          'star' + (stars.has(i) ? ' found' : '');

        b.textContent = '✦';

        b.style.left = x + '%';
        b.style.top = y + '%';

        b.setAttribute(
          'aria-label',
          'Revelar lembrança ' + (i + 1)
        );

        b.onclick = () => {
          stars.add(i);
          b.classList.add('found');

          document.getElementById('overlay').innerHTML = `
            <div class="memory">
              ${CONFIG.memorias[i]}
            </div>
          `;

          document.getElementById('status').textContent =
            stars.size + '/3 lembranças encontradas';

          sound(550 + i * 90);

          if (stars.size === 3) win();
        };

        v.append(b);
      }
    );
  }

  /* CAPÍTULO 2 - A ROSA */

  if (chapter === 2) {
    view(
      'CAPÍTULO II · A ROSA',

      'A rosa precisa de <em>cuidado.</em>',

      'Uma rosa delicada cresceu neste planeta. Ajude-a a florescer: escolha três gestos de carinho.',

      `<div class="panel">
        <h3>Cuide da rosa</h3>

        <div id="gestures">
          <button class="choice" onclick="care(this)">
            💧 Regar
          </button>

          <button class="choice" onclick="care(this)">
            ☀️ Dar luz
          </button>

          <button class="choice" onclick="care(this)">
            ♡ Dar atenção
          </button>
        </div>

        <p id="status">0/3 gestos</p>

        <button id="next"
          class="primary"
          onclick="go(3)"
          hidden>
          Seguir a raposa →
        </button>
      </div>`
    );
  }

  /* CAPÍTULO 3 - A RAPOSA */

  if (chapter === 3) {
    view(
      'CAPÍTULO III · A RAPOSA',

      'Os laços que <em>criamos.</em>',

      'A raposa trouxe um jogo de memória. Encontre os quatro pares de símbolos do afeto.',

      `<div class="panel">
        <h3>Jogo da memória</h3>

        <div class="tiles" id="tiles"></div>

        <p id="status">0/4 pares</p>

        <button id="next"
          class="primary"
          onclick="go(4)"
          hidden>
          Próximo planeta →
        </button>
      </div>`,

      'fox'
    );

    setupCards();
  }

  /* CAPÍTULO 4 - CONSTELAÇÕES */

  if (chapter === 4) {
    view(
      'CAPÍTULO IV · CONSTELAÇÕES',

      'Uma história em <em>quatro passos.</em>',

      'Acenda os astros na ordem: encontro, conversa, carinho e amor.',

      `<div class="panel">
        <h3>Desenhe nossa constelação</h3>

        <div class="paths">
          ${['☄', '☾', '✿', '♡'].map(
            (s, i) => `
              <button
                class="node"
                data-i="${i}"
                onclick="tapNode(${i},this)">
                ${s}
              </button>
            `
          ).join('')}
        </div>

        <p id="status">
          0/4 estrelas conectadas
        </p>

        <button class="secondary"
          onclick="seq=[];render()">
          Recomeçar
        </button>

        <button id="next"
          class="primary"
          onclick="go(5)"
          hidden>
          Último segredo →
        </button>
      </div>`,

      'prince'
    );
  }

  /* CAPÍTULO 5 - A DATA SECRETA */

  if (chapter === 5) {
    view(
      'CAPÍTULO V · O SEGREDO',

      'Uma data no <em>universo.</em>',

      'Existe um dia que mudou o nosso céu. Lembra quando decidimos começar essa história?',

      `<div class="panel">
        <h3>O cadeado das estrelas</h3>

        <input
          id="password"
          maxlength="5"
          inputmode="numeric"
          placeholder="DDMM"
          aria-label="Data especial">

        <p id="status">
          Dica: dia e mês do nosso pedido de namoro.
        </p>

        <button class="primary" onclick="unlock()">
          Desbloquear ✦
        </button>
      </div>`
    );
  }

  /* EPÍLOGO - CONTINUA... */

  if (chapter === 6) {
    view(
      'EPÍLOGO · NÃO É O FIM',

      'Até breve, <em>meu pequeno planeta.</em>',

      'Você encontrou todas as estrelas, cuidou da rosa e percorreu o nosso universo. Mas esta não é a última página. Ainda existem muitos mundos, histórias e surpresas que quero descobrir com você. Por enquanto, guarde este pedacinho do céu. O resto da nossa aventura ainda está por vir. ♡',

      `<div class="panel">
        <h3>Continua...</h3>

        <p>
          Uma nova surpresa aparecerá quando
          você menos esperar. ✧
        </p>

        <button class="primary" onclick="go(0)">
          Recomeçar nossa viagem ↻
        </button>
      </div>`,

      'prince'
    );

    celebrate();
  }
}

/* ==========================================
   MINIGAME 1 - CUIDAR DA ROSA
========================================== */

function care(b) {

  if (b.disabled) return;

  b.disabled = true;
  b.style.background = '#c3d7b8';
  b.style.color = '#15203a';

  petals++;

  document.getElementById('status').textContent =
    petals + '/3 gestos';

  sound(600 + petals * 80);

  if (petals === 3) {
    win();
  }
}

/* ==========================================
   MINIGAME 2 - JOGO DA MEMÓRIA
========================================== */

function setupCards() {

  let symbols = ['🌹', '⭐', '🦊', '💛'];

  cards = [...symbols, ...symbols]
    .sort(() => Math.random() - .5);

  flipped = [];
  matches = 0;
  locked = false;

  document.getElementById('tiles').innerHTML =
    cards.map((_, i) => `
      <button
        class="tile"
        id="tile${i}"
        onclick="flip(${i})"
        aria-label="Virar carta">
        ✦
      </button>
    `).join('');
}

function flip(i) {

  if (
    locked ||
    flipped.includes(i) ||
    document.getElementById('tile' + i)
      .classList.contains('matched')
  ) return;

  let b = document.getElementById('tile' + i);

  b.textContent = cards[i];
  b.classList.add('open');

  flipped.push(i);
  sound(540);

  if (flipped.length === 2) {

    let [a, c] = flipped;

    if (cards[a] === cards[c]) {

      for (let j of flipped) {
        document.getElementById('tile' + j)
          .classList.add('matched');
      }

      matches++;
      flipped = [];

      document.getElementById('status').textContent =
        matches + '/4 pares';

      if (matches === 4) win();

    } else {

      locked = true;

      setTimeout(() => {
        for (let j of [a, c]) {

          let e = document.getElementById('tile' + j);

          if (e) {
            e.textContent = '✦';
            e.classList.remove('open');
          }
        }

        flipped = [];
        locked = false;
      }, 850);
    }
  }
}

/* ==========================================
   MINIGAME 3 - CONSTELAÇÃO
========================================== */

function tapNode(i, b) {

  if (i !== seq.length) {

    document.getElementById('status').textContent =
      'Siga a ordem da história ✧';

    sound(280);
    return;
  }

  seq.push(i);

  b.disabled = true;
  b.classList.add('active');

  document.getElementById('status').textContent =
    seq.length + '/4 estrelas conectadas';

  sound(520 + i * 100);

  if (seq.length === 4) {
    win();
  }
}

/* ==========================================
   CADEADO DA DATA ESPECIAL
========================================== */

function unlock() {

  let v = document.getElementById('password')
    .value.replace(/\D/g, '');

  if (v === CONFIG.senha) {

    sound(900);
    go(6);

  } else {

    document.getElementById('status').textContent =
      'Ainda não... tente lembrar de 7 de setembro ♡';

    sound(290);
  }
}

/* ==========================================
   INICIAR JOGO
========================================== */

render();

</script>
